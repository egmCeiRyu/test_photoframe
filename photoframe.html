<!DOCTYPE html>
<html lang="ja">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<link rel="stylesheet" href="css/common.css">
<link rel="stylesheet" href="css/photoframe.css?v=20261105_pinch_bounded">

<title>Photo Frame</title>
</head>

<body>


<div id="cameraPage">

    <video
        id="cameraVideo"
        autoplay
        playsinline
        muted>
    </video>

    <canvas id="livePreviewCanvas"></canvas>

    <img
        id="selectedPhotoFrame"
        alt="フォトフレーム">

    <canvas id="captureCanvas"></canvas>

<div class="camera-top-actions"><a id="homeButton" href="home.html">🏠</a><button id="openInstructionsBtn" class="instructions-help-btn" type="button"
    aria-haspopup="dialog" aria-controls="instructionsDialog">使い方</button><button id="resetFrameBtn" type="button" aria-label="フレームの位置とサイズをリセット">リセット</button>    <button
        id="switchCameraBtn"
        class="switch-camera-btn"
        type="button"
        aria-label="カメラ切替">

        <img
            src="assets/icons/camera-switch.png"
            alt=""
            class="switch-camera-img">

    </button></div>

    <nav class="bottom-menu">

    
        <button
            id="captureBtn"
            class="capture-main-btn"
            type="button"
            aria-label="撮影">

            <svg
                class="capture-camera-icon"
                viewBox="0 0 64 64"
                aria-hidden="true">

                <path
                    d="M21 24L25 18H39L43 24H48C51.3 24 54 26.7 54 30V45C54 48.3 51.3 51 48 51H16C12.7 51 10 48.3 10 45V30C10 26.7 12.7 24 16 24H21Z">
                </path>

                <circle
                    cx="32"
                    cy="38"
                    r="10">
                </circle>

                <circle
                    cx="47"
                    cy="31"
                    r="2.5">
                </circle>
            </svg>

        </button>

        <button
            id="openFramePanelBtn"
            class="bottom-menu-btn"
            type="button"
            aria-label="フレーム">

            <svg class="bottom-icon" viewBox="0 0 24 24" aria-hidden="true">
                <rect x="4" y="5" width="16" height="14" rx="2"/>
                <rect x="7" y="8" width="10" height="8" rx="1.2"/>
                <circle cx="17" cy="7" r="1.2"/>
            </svg>

            <span class="bottom-label">フレーム</span>
        </button>

        <button
            id="layerToggleBtn"
            class="bottom-menu-btn layer-toggle-btn is-behind"
            type="button"
            aria-label="人物より後ろに表示"
            aria-pressed="true">

            <span class="layer-toggle-icon" aria-hidden="true">
                <span class="layer-toggle-person"></span>
                <span class="layer-toggle-frame"></span>
            </span>

            <span id="layerToggleLabel" class="bottom-label">後ろ</span>
        </button>

    </nav>

    <section
        id="framePanel"
        class="frame-panel hidden">

        <button
            id="closeFramePanelBtn"
            class="frame-panel-close"
            type="button">
            ✕
        </button>

        <div class="frame-panel-title">
            フレームを選択してください
        </div>

        <p id="frameUsageMessage" class="frame-usage-message">フレームを背景として使用される場合は、右下のボタンを（後ろ）に設定してご使用ください。</p>

        <div
            id="frameCarousel"
            class="frame-carousel" tabindex="0" aria-label="フレーム一覧。左右にスワイプできます">
        </div>
        <nav class="frame-page-navigation" aria-label="フレームのページ切替">
            <button id="previousFramePage" type="button" aria-label="前のページ">‹</button>
            <span id="framePageNumber" aria-live="polite"></span>
            <button id="nextFramePage" type="button" aria-label="次のページ">›</button>
        </nav>

    </section>

    <section
        id="previewArea"
        class="preview-area hidden">

        <img
            id="previewImage"
            alt="プレビュー">

        <div class="preview-bottom">
            <button
                id="retakeBtn"
                type="button">
                撮り直す
            </button>

            <button
                id="saveBtn"
                type="button">
                保存
            </button>
        </div>

    </section>

</div>




<dialog id="instructionsDialog" class="instructions-dialog"
    aria-labelledby="instructionsTitle" aria-describedby="instructionsSteps">
    <h1 id="instructionsTitle">ARフォトフレームの使い方</h1>
    <ol id="instructionsSteps">
        <li>左下のフォトフレームリストからフレームを選ぼう。</li>
        <li>右下のボタンで、フレーム上に映る人物の手前・奥の切り替えができます。</li>
        <li>指2本を広げるとフレームを拡大し、つまむと元のサイズより小さくできます。拡大・縮小したフレームは指1本で移動できます。</li>
<li>「リセット」で元のサイズと位置に戻せます。</li>
<li>中央のカメラボタンで写真を撮ろう。</li>
    </ol>
    <form method="dialog">
        <button class="instructions-start-btn" autofocus>はじめる</button>
    </form>
</dialog>

<script
    src="https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/selfie_segmentation.js">
</script>

<script src="js/photoframe.js?v=20261106_zoom_out"></script>

</script>

</body>
</html>
